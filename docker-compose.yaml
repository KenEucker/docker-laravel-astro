services:
  # ---------------------------------------------------------------------------
  # Edge reverse proxy (routes by hostname using container labels)
  # Enabled only when profile "proxy" is used.
  # ---------------------------------------------------------------------------
  caddy:
    profiles: ["proxy"]
    image: lucaslorentz/caddy-docker-proxy:2.9-alpine
    ports:
      - "80:80"
      # Enable in production when you have real DNS pointed at your server:
      # - "443:443"
    environment:
      # Must match the network name that caddy + upstream services share.
      - CADDY_INGRESS_NETWORKS=${CADDY_INGRESS_NETWORKS:-web}
      - CADDY_GLOBAL_OPTIONS=${CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - laravel
      - astro

  # ---------------------------------------------------------------------------
  # Database (internal only; host port mapping optional)
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    volumes:
      - dbdata:/var/lib/mysql
    # Optional: keep this if you want to connect from your host machine (TablePlus, etc.)
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 3s
      timeout: 5s
      retries: 40
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Laravel (API + Orchid admin UI)
  # ---------------------------------------------------------------------------
  laravel:
    build:
      context: ./backend
    working_dir: /var/www/html/app
    env_file:
      - ./.env
    volumes:
      # Full Laravel app lives here (persistent)
      - laravel_app:/var/www/html/app
      - laravel_uploads:/var/www/html/app/storage/app/public

      # OPTIONAL: drop files you want to override into ./backend/overrides/*
      # Your backend entrypoint can copy these into the app volume.
      - ./backend/app:/overrides/app:ro
      - ./backend/database:/overrides/database:ro
      - ./backend/routes:/overrides/routes:ro
      - ./backend/config:/overrides/config:ro
      - ./backend/bootstrap:/overrides/bootstrap:ro
    depends_on:
      db:
        condition: service_healthy

    # Localhost fallback (when NOT using caddy)
    ports:
      - "${LARAVEL_HOST_PORT:-8000}:8000"

    networks:
      - internal
      - web

    # Caddy labels only matter when caddy is running (profile proxy)
    labels:
      # Route: admin hostname -> laravel:8000
      # Dev:  ADMIN_HOSTNAME=admin.local.test
      # Prod: ADMIN_HOSTNAME=admin.company.com
      caddy: http://${ADMIN_HOSTNAME:-admin.local.test}
      caddy.reverse_proxy: "{{upstreams 8000}}"

  # ---------------------------------------------------------------------------
  # Astro (intranet UI)
  # ---------------------------------------------------------------------------
  astro:
    build:
      context: ./frontend
    working_dir: /app
    env_file:
      - ./.env
    volumes:
      - ./frontend:/app
      - astro_node_modules:/app/node_modules
    environment:
      # Dev file watching
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
      WATCHPACK_POLLING: "true"

    # Localhost fallback (when NOT using caddy)
    ports:
      - "${ASTRO_HOST_PORT:-3000}:3000"

    networks:
      - internal
      - web

    labels:
      # Route: intranet hostname -> astro:3000
      # Dev:  INTRANET_HOSTNAME=intranet.local.test
      # Prod: INTRANET_HOSTNAME=intranet.company.com
      caddy: http://${INTRANET_HOSTNAME:-intranet.local.test}
      caddy.reverse_proxy: "{{upstreams 3000}}"

volumes:
  dbdata:
  laravel_app:
  laravel_uploads:
  astro_node_modules:
  caddy_data:
  caddy_config:

networks:
  # Public-facing network: only Caddy binds host ports (when enabled),
  # but services are reachable by Caddy here.
  web:
    name: ${CADDY_INGRESS_NETWORKS:-web}
  # Internal network: app-to-app traffic (astro <-> laravel <-> db)
  internal:
    driver: bridge
